services:
  - type: web
    name: nspxn-ai-review
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /

    buildCommand: |
      pip install -r requirements.txt
      pip install -r requirements-presidio.txt
      python -m spacy download en_core_web_lg

    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port 10000
